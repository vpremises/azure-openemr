name: Verified installer sources
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify the official archive in isolated temporary storage
        run: |
          bash -n setup/install-infracost.sh
          install -d "$RUNNER_TEMP/reviewed-infracost"
          INFRACOST_INSTALL_DIR="$RUNNER_TEMP/reviewed-infracost" bash setup/install-infracost.sh
          "$RUNNER_TEMP/reviewed-infracost/infracost" --version
